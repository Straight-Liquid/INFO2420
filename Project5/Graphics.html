<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fossil Frontier - Graphics</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f7eedb;
            color: #3b200f;
            text-align: center;
        }
        h1 { margin: 12px 0 10px; }
        p { line-height: 1.5; }
        nav { margin: 20px 0; }
        nav a { color: #603519; margin: 0 10px; }
        img { height: auto; max-width: 100%; }
        .gallery {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
            margin: 24px auto;
        }
        .gallery figure { margin: 0; }
        figcaption { margin-top: 8px; }
        footer { margin-top: 30px; font-size: 0.9em; }
    </style>
</head>
<body>
    <header>
        <h1>Fossil Frontier Graphics</h1>
        <p>Banner and logo for our dinosaur fossil hunting business.</p>
    </header>

    <main class="gallery">
        <figure>
            <img src="Images/FossilBanner.png"
                 alt="Fossil Frontier banner with a dinosaur skull, desert mountains, and an orange sun"
                 width="600" height="150">
        </figure>

        <figure>
            <img src="Images/FossilLogo.png"
                 alt="Circular Fossil Frontier logo dinosaur skull, mountains, and footprints"
                 width="150" height="175">
        </figure>
    </main>

    <nav aria-label="Project 5 pages">
        <a href="index.html">Return Home</a>
        <a href="SiteDesign.html">View Color Palette</a>
    </nav>
</body>
</html>
